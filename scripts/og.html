<!doctype html>
<!-- Modelo da imagem Open Graph (1200x630). Gere com: pnpm og -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Display";
        src: url("../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 400 900;
      }
      @font-face {
        font-family: "Mono";
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 800;
      }
      :root {
        --paper: #f8f6fc;
        --ink: #1a1229;
        --muted: #5f566f;
        --violet: #5b2fc9;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 64px;
        padding: 64px 72px;
      }
      .text {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .meta {
        font-family: "Mono", monospace;
        font-size: 20px;
        color: var(--muted);
      }
      h1 {
        font-family: "Display", sans-serif;
        font-weight: 600;
        font-size: 128px;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }
      h1 span {
        color: var(--ink);
      }
      .thesis::before {
        content: "";
        display: block;
        width: 48px;
        height: 4px;
        background: var(--violet);
        margin-bottom: 24px;
      }
      .thesis {
        font-family: "Display", sans-serif;
        font-size: 32px;
        line-height: 1.2;
        font-weight: 450;
        max-width: 560px;
      }
      .photo {
        border-radius: 8px;
        overflow: hidden;
        background: #3a3a3a;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 20%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="meta">Portfólio · desenvolvedor full stack</p>
      <h1>Lucas<br /><span>Gomes</span></h1>
      <p class="thesis">Sou desenvolvedor full stack, mais à vontade no back-end.</p>
    </div>
    <div class="photo"><img src="../src/assets/profile.png" alt="" /></div>
  </body>
</html>
